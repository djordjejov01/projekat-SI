<h2>Lista proizvoda</h2>

<table border="1">
  <thead>
    <tr>
      <th>Rb.</th>  <!-- redni broj -->
      <th>Naziv</th>
      <th>Cena</th>
      <th>Akcija</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let proizvod of proizvodi; let i = index" 
        (click)="selectProizvod(proizvod)" 
        [style.backgroundColor]="selectedProizvod?.id === proizvod.id ? '#eef' : 'transparent'">
      <td>{{ i + 1 }}</td>  <!-- redni broj -->
      <td>{{ proizvod.naziv }}</td>
      <td>{{ proizvod.cena | currency:'RSD':'symbol':'1.0-0' }}</td>
      <td>
        <button (click)="selectProizvod(proizvod); $event.stopPropagation();">Izmeni</button>
        <button (click)="deleteProizvod(proizvod.id); $event.stopPropagation();">Obriši</button>
      </td>

    </tr>
  </tbody>
</table>

<hr>

<h3 *ngIf="selectedProizvod">Izmeni proizvod</h3>
<h3 *ngIf="!selectedProizvod">Novi proizvod</h3>

<form (ngSubmit)="selectedProizvod ? updateProizvod() : createProizvod()">
  <label>
    Naziv:
    <input [(ngModel)]="formProizvod.naziv" name="naziv" required>
  </label>
  <br>
  <label>
    Cena:
    <input type="number" [(ngModel)]="formProizvod.cena" name="cena" required>
  </label>
  <br><br>
  <button type="submit">{{ selectedProizvod ? 'Sačuvaj' : 'Dodaj' }}</button>
  <button type="button" (click)="cancelEdit()" *ngIf="selectedProizvod">Otkaži</button>
</form>
