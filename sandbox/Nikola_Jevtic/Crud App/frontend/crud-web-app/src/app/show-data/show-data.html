<table>
    <tr>
        <th>ID</th>
        <th>Player Name</th>
        <th>Team</th>
        <th>Position</th>
        <th colspan="2">Edit/Delete</th>
    </tr>
    
    <tr *ngFor="let player of data">
        <td>{{player.id}}</td>
        <td>{{player.name}}</td>
        <td>{{player.team}}</td>
        <td>{{player.position}}</td>
        <td><button (click)="currentEditable=player">Edit</button></td>
        <td><button (click)="callDeletePlayer(player)">Delete</button></td>
    </tr>  
</table>
