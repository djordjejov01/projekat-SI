<form *ngIf="toEdit">

    <fieldset style="border: 2px solid #333; padding: 1em;">
        <legend style="font-weight: bold;">Edit Player</legend>

        <label for="playerId">ID: </label>
        <input type="text" [value]="toEdit.id" name="playerId" #id [disabled]="true">
        <br><br>

        <label for="playerName">Name: </label>
        <input type="text" [value]="toEdit.name" name="playerName" #name>
        <br><br>

        <label for="playerTeam">Team: </label>
        <input type="text" [value]="toEdit.team" name="playerTeam" #team>
        <br><br>

        <label for="playerPosition">Position: </label>
        <input type="text" [value]="toEdit.position" name="playerPosition" #position>
        <br><br>

        <button type="button" (click)="editPlayer(id,name,team,position)">Confirm Edit</button>
    </fieldset>
</form>
