<form>

    <fieldset style="border: 2px solid #333; padding: 1em;">
        <legend style="font-weight: bold;">Add Player</legend>

        <label for="playerName">Name: </label>
        <input type="text"  name="playerName" placeholder="Name" #name>
        <br><br>

        <label for="playerTeam">Team: </label>
        <input type="text"  name="playerTeam" placeholder="Team" #team>
        <br><br>

        <label for="playerPosition">Position: </label>
        <input type="text"  name="playerPosition" placeholder="Position" #position>
        <br><br>

        <button type="button" (click)="addPlayer(name,team,position)">Confirm Addition</button>
    </fieldset>
</form>
