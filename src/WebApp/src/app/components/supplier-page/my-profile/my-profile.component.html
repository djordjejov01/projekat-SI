<div id="outer">
    <div id="main">
        <div id="leftside">
            <div id="info">
                <p id="title">My Profile</p>
                <p id="role">Supplier</p>
            </div>

            <div class="profile-container">
                
                <label for="fileUpload" class="upload-label">
                    <img [src]="previewUrl || defaultImage" class="profile-img" alt="Profile" />
                    <input type="file" id="fileUpload" (change)="onFileSelected($event)" accept="image/*" hidden />
                </label>
                <p id="user">{{currSupplier?.getUsername()}}</p>
                <button id="upbut" (click)="triggerFileUpload()">
                    <i class="pi pi-upload"></i>Choose
                </button>
                <button class="del" (click)="deletePic()">
                    <i class="pi pi-times"></i>Remove Picture
                </button>
            </div>


            <div id="form">
                <div id="row">
                    <div id="field">
                        <label for="name">Name</label>
                        <input id="name" type="text" [value]="currSupplier?.getCompanyName()" class="form-control" />
                    </div>
                    <div id="field">
                        <label for="username1">Username</label>
                        <input id="username1" type="text" [value]="currSupplier?.getUsername()" class="form-control" />
                    </div>

                </div>
                <div id="row">
                    <div id="field">
                        <label for="email">Email</label>
                        <input id="email" type="text" [value]="currSupplier?.getEmail()" class="form-control" />
                    </div>
                    <div id="field">
                        <label for="phone">Phone Number</label>
                        <input id="phone" type="text" [value]="currSupplier?.getPhoneNumber()" class="form-control" />
                    </div>

                </div>
                <label for="bio">Bio</label>
                <textarea name="bio" id="bio">{{currSupplier?.getCompanyBio()}}</textarea>
                <label for="website">Website</label>
                <input id="website" type="text" [value]="currSupplier?.getWebsite()" class="form-control" />
                <button id="upp" (click)="update()">Update Profile</button>

                <div id="pass">
                    <div id="onepass">
                        <label for="cpass">Current Password</label>
                        <input id="cpass" type="password" class="form-control" />
                    </div>
                    <div id="onepass">
                        <label for="npass">New Password</label>
                        <input id="npass" type="password" class="form-control" />
                    </div>

                    <div id="onepass">
                        <label for="cnpass">Confirm New Password</label>
                        <input id="cnpass" type="password" class="form-control" />
                    </div>

                </div>
                <button id="upp" (click)="updatePass()">Change Password</button>
            </div>
        </div>
        <div id="rightside">
            <h1>Resource Overview</h1>

            <div id="card">
                <i class="pi pi-calendar-clock"></i>
                <div id="addinfo">
                    <p id="amount">{{resources?.length}}</p>
                    <p id="type">Resources</p>
                </div>
            </div>
            <div id="card">
                <i class="pi pi-users"></i>
                <div id="addinfo">
                    <p id="amount">{{bookedResources?.length}}</p>
                    <p id="type">Unavailable Resources</p>
                </div>
            </div>
            <div id="card">
                <i class="pi pi-calendar"></i>
                <div id="addinfo">
                    <p id="amount">{{freeResources?.length}}</p>
                    <p id="type">Available Resources</p>
                </div>
            </div>
        </div>
    </div>
</div>
