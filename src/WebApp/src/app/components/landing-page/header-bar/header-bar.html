<header>
    <div id="leftside">
        <img src="./assets/logo91.png" alt="syncup logo" id="logo">
        <p routerLink="/home">{{ 'HOME' | translate }}</p>
        <p>{{ 'ABOUTUS' | translate }}</p>
        <p>{{ 'ContactUs' | translate }}</p>
        <p routerLink="/organizer">Organizer</p>
        <p routerLink="/admin">Admin</p>
    </div>
    <div id="rightside">
        <select (change)="changeLanguage($event)">
            <option value="sr">Srpski</option>
            <option value="en">English</option>
        </select>
        <p>|</p>
        <p id="login" routerLink="/login">{{ 'LOGIN' | translate }}</p>
        <p>/</p>
        <p id="register" routerLink="/register">{{ 'REGISTER' | translate }}</p>
    </div>
</header>
