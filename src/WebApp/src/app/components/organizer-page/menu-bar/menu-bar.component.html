<div>
  <!-- Added hamburger toggle for mobile -->
  <input type="checkbox" id="menuToggle" class="menu-toggle" aria-label="Toggle menu">
  <label for="menuToggle" class="menu-burger" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <div id="bar">
      <div id="menu">
          <app-menu-item
      *ngFor="let item of items; let i = index"
      [title]="item.title"
      [link] = "item.link"
      [image]="selectedIndex === i ? item.imageWhite : item.image"
      [isSelected]="selectedIndex === i"
      (clicked)="selectItem(i)"
      [id] = "'item' + i">
    </app-menu-item>
      </div>
  </div>
</div>
