<h1>Events</h1>

<p-table
    #dt
    [value]="allEvents"
    [(selection)]="selectedEvents"
    dataKey="eventId"
    [rowHover]="true"
    [rows]="5"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[5 ,10, 25, 50]"
    [loading]="loading"
    [paginator]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [filterDelay]="0"
    [globalFilterFields]="['name', 'date', 'endDate', 'category', 'status' , 'location']"
>
    <ng-template #caption>
        <div class="flex justify-between">
            <p-button [outlined]="true" icon="pi pi-filter-slash" label="Clear" (click)="clear(dt)" />
            <p-iconField iconPosition="left">
                <p-inputIcon>
                    <i class="pi pi-search"></i>
                </p-inputIcon>
                <input pInputText type="text" [(ngModel)]="searchValue" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Keyboard Search" />
            </p-iconField>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th style="width: 4rem">
                <p-tableHeaderCheckbox />
            </th>
            <th style="width: 4rem" style="max-width: 5rem">
                Picture
            </th>
            <th pSortableColumn="name" style="min-width: 14rem">
                <div class="flex justify-between items-center">
                    Name
                    <p-sortIcon field="name" />
                    <p-columnFilter type="text" field="name" display="menu" class="ml-auto" />
                </div>
            </th>
            <th pSortableColumn="date" style="min-width: 12rem">
                <div class="flex justify-between items-center">
                    Start Date
                    <p-sortIcon field="date" />
                    <p-columnFilter type="date" field="date" display="menu" class="ml-auto" />
                </div>
            </th>
            <th pSortableColumn="endDate" style="min-width: 10rem">
                <div class="flex justify-between items-center">
                    End Date
                    <p-sortIcon field="endDate" />
                    <p-columnFilter type="date" field="endDate" display="menu" class="ml-auto" />
                </div>
            </th>
            <th pSortableColumn="category" style="min-width: 14rem">
                <div class="flex justify-between items-center">
                    Category
                    <p-sortIcon field="category" />
                    <p-columnFilter type="text" field="category" display="menu" class="ml-auto" />
                </div>
            </th>
            <th pSortableColumn="status" style="max-width: 14rem">
                <div class="flex justify-between items-center">
                    Status
                    <p-sortIcon field="status" />
                    <p-columnFilter type="text" field="status" display="menu" class="ml-auto" />
                </div>
            </th>
            <th pSortableColumn="location" style="min-width: 14rem">
                <div class="flex justify-between items-center">
                    Location
                    <p-sortIcon field="location" />
                    <p-columnFilter type="text" field="location" display="menu" class="ml-auto" />
                </div>
            </th>

            <th style="width: 5rem">Actions</th>
        </tr>
    </ng-template>
    <ng-template #body let-event>
        <tr class="p-selectable-row">
            <td>
                <p-tableCheckbox [value]="event" />
            </td>
            <td>
                <img [src]="event.image" alt="Event image">
            </td>
            <td>
                {{ event.title }}
            </td>
            <td>
                {{ event.startDateTime | date: 'dd/MM/yyyy' }}
            </td>
            <td>
                {{ event.endDateTime | date: 'dd/MM/yyyy' }}
            </td>
            <td>
                {{ event.category }}
            </td>
            <td>
                Status
            </td>
            <td>
                {{ event.location }}
            </td>
            <td style="text-align: center; display: flex; gap:8px; padding-top:25px ; padding-bottom:25px ;">
                <p-button rounded icon="pi pi-eye" (click) = "viewEvent(event.eventId)"/> 
                <p-button rounded icon="pi pi-pencil" (click) = "editEvent(event.eventId)"/>
                <p-button rounded icon="pi pi-trash" (click) = "deleteEvent(event.eventId)"/>
            </td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="8">No events found.</td>
        </tr>
    </ng-template>
</p-table>
