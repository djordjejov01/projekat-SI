
<header>
    <p-breadcrumb [model]="items"></p-breadcrumb>
    <div class="title-buttons">
        <h1 class="font-archivo">{{ eventTitle }}</h1>
        <div class="buttons">
            <button class="edit-btn font-inter" (click)="onEditClick()"><i class="pi pi-pen-to-square"></i>Edit Event</button>
            <button class="delete-btn font-inter"><i class="pi pi-trash"></i>Delete Event</button>
        </div>
    </div> 

    <hr class="custom-hr">
</header>
