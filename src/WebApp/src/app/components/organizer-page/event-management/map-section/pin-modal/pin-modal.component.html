<p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '30rem', height: '40rem'}" *ngIf="pinForm">
    <ng-template #header>
        <div class="formTitle">
            <h3>Add a new Pin</h3>
            <p>Fill in the details below to add a new pin.</p>
        </div>
    </ng-template>
    
    <form action="" [formGroup]="pinForm" class="pinForm">

        <div class="form-inputs">

            <div  class="input-wrapper">

                <p>Activity Title</p>
                <p-floatlabel class="w-full md:w-56" variant="on">
                    <input  type="text"  pInputText  placeholder=" "  formControlName="title"  inputId="title"  class="w-full md:w-56 h-10 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500" />
                <label for="title">Enter Pin Title</label>
                </p-floatlabel>

            </div>

            <div  class="input-wrapper">

                <p>Description</p>
                <p-floatlabel class="w-full md:w-56" variant="on">
                    <textarea pTextarea id="description" placeholder=" " formControlName="description" rows="5" cols="30" style="resize: none" class="h-full w-full md:w-56 h-10 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500"></textarea>
                <label for="description">Describe Your Pin</label>
                </p-floatlabel>

            </div>

            <div  class="input-wrapper">

                <p>Type</p>
                <p-floatlabel class="w-full" variant="on">
                    <p-select  [options]="pinTypeOptions"  name="type"  formControlName="type"  placeholder=" "  inputId="type"  class="w-full h-10 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#636AE8] focus:border-[#636AE8]"/>
                    <label for="type">Select Pin Type</label>
                </p-floatlabel>

            </div>

            <div class="form-buttons">
                <p-button 
                label="Save Changes"
                icon="pi pi-pen-to-square"
                [raised]="true"
                (onClick)="savePin()"
                severity="primary"
                ></p-button>

                <p-button 
                    label="Cancel"
                    icon="pi pi-times"
                    [raised]="true"
                    severity="secondary"
                    type="button"
                    (onClick)="cancel()"
                ></p-button>
            </div>
        </div>
    </form>
</p-dialog>
