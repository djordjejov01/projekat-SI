<ng-container *ngIf="eventBasicInfo">
  <app-event-management-header 
    [eventTitle]="eventBasicInfo.getTitle()" 
    [editMode]="editMode" 
    (editModeChange)="onToggleEditMode($event)"
    [parentEventId]="eventBasicInfo.getParentEventId()">
  </app-event-management-header>

  <app-event-basic-info 
    [eventBasicInfo]="eventBasicInfo" 
    [editMode]="editMode"
    (cancelEdit)="onToggleEditMode(false)"
    (eventUpdated)="onEventUpdated($event)">
  </app-event-basic-info>
</ng-container>
