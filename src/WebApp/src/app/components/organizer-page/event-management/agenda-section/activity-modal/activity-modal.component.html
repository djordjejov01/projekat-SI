<p-dialog
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '50rem', height: '55rem' }"
  (onHide)="onCancleClick()"
  [closable]="false"
  [dismissableMask]="false"
  [closeOnEscape]="false"
>
  <ng-template pTemplate="header">
    <div class="flex justify-between items-start w-full">
      <div class="formTitle">
        <h3>{{ 'ACTIVITY.CREATE_TITLE' | translate }}</h3>
        <p>{{ 'ACTIVITY.CREATE_SUBTITLE' | translate }}</p>
      </div>
      <button
        type="button"
        class="p-dialog-header-icon p-link p-button-rounded p-button-text exit-button"
        (click)="onCancleClick()"
        pTooltip="{{ 'COMMON.CLOSE' | translate }}"
        tooltipPosition="left"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>
  </ng-template>
    
  <form action="" [formGroup]="activityForm" class="activityForm">
    <div class="form-inputs">

      <div class="input-wrapper">
        <p>{{ 'ACTIVITY.TITLE' | translate }}</p>
        <p-floatlabel class="w-full md:w-56" variant="on">
          <input
            type="text"
            pInputText
            placeholder=" "
            formControlName="title"
            inputId="title"
            class="w-full md:w-56 h-10 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500"
          />
          <label for="title">{{ 'ACTIVITY.TITLE_PLACEHOLDER' | translate }}</label>
        </p-floatlabel>
      </div>

      <div class="input-wrapper">
        <p>{{ 'ACTIVITY.CATEGORY' | translate }}</p>
        <p-floatlabel class="w-full" variant="on">
          <p-select
            [options]="categories"
            name="category"
            formControlName="category"
            placeholder=" "
            inputId="category"
            class="w-full h-10 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#636AE8] focus:border-[#636AE8]"
          />
          <label for="category">{{ 'ACTIVITY.CATEGORY_PLACEHOLDER' | translate }}</label>
        </p-floatlabel>
      </div>

      <div class="input-wrapper">
        <p>{{ 'ACTIVITY.DESCRIPTION' | translate }}</p>
        <p-floatlabel class="w-full md:w-56" variant="on">
          <textarea
            pTextarea
            id="description"
            placeholder=" "
            formControlName="description"
            rows="5"
            cols="30"
            style="resize: none"
            class="h-full w-full md:w-56 h-10 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500"
          ></textarea>
          <label for="description">{{ 'ACTIVITY.DESCRIPTION_PLACEHOLDER' | translate }}</label>
        </p-floatlabel>
      </div>

      <div class="dates">
        <div class="input-wrapper">
          <p>{{ 'ACTIVITY.START_TIME' | translate }}</p>
          <p-floatlabel class="w-full md:w-56" variant="on">
            <p-datepicker
              inputId="startTime"
              placeholder=" "
              formControlName="startTime"
              [showTime]="true"
              hourFormat="24"
              [minDate]="parentEventBasicInfo.getStartDate()"
              [maxDate]="parentEventBasicInfo.getEndDate()"
              [style]="{ width: '100%' }"
              inputStyleClass="w-full h-10 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500"
            />
            <label for="startTime">{{ 'ACTIVITY.START_TIME_PLACEHOLDER' | translate }}</label>
          </p-floatlabel>
        </div>

        <div class="input-wrapper">
          <p>{{ 'ACTIVITY.END_TIME' | translate }}</p>
          <p-floatlabel class="w-full md:w-56" variant="on">
            <p-datepicker
              inputId="endTime"
              placeholder=" "
              formControlName="endTime"
              [showTime]="true"
              hourFormat="24"
              [minDate]="parentEventBasicInfo.getStartDate()"
              [maxDate]="parentEventBasicInfo.getEndDate()"
              [style]="{ width: '100%' }"
              inputStyleClass="w-full h-10 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500"
            />
            <label for="endTime">{{ 'ACTIVITY.END_TIME_PLACEHOLDER' | translate }}</label>
          </p-floatlabel>
        </div>
      </div>

      <div class="form-buttons">
        <p-button
          label="{{ 'COMMON.SAVE' | translate }}"
          icon="pi pi-pen-to-square"
          [raised]="true"
          (onClick)="submitForm()"
          severity="primary"
        ></p-button>

        <p-button
          label="{{ 'COMMON.CANCEL' | translate }}"
          icon="pi pi-times"
          [raised]="true"
          severity="secondary"
          type="button"
          (onClick)="onCancleClick()"
        ></p-button>
      </div>
    </div>
  </form>
</p-dialog>
